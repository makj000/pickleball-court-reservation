AWSTemplateFormatVersion: "2010-09-09"
Description: Pickleball monitor infrastructure around the existing Lambda, buckets, and image repository.

Parameters:
  FunctionName:
    Type: String
  LambdaRoleName:
    Type: String
  UiBucketName:
    Type: String
  WorkQueueName:
    Type: String
  QueuePolicyName:
    Type: String
    Default: pickleball-monitor-work-queue

Resources:
  WorkQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Ref WorkQueueName
      VisibilityTimeout: 1200
      ReceiveMessageWaitTimeSeconds: 20
      MessageRetentionPeriod: 86400

  LambdaSqsPolicy:
    Type: AWS::IAM::RolePolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: !Ref LambdaRoleName
      PolicyName: !Ref QueuePolicyName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - sqs:SendMessage
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
              - sqs:ChangeMessageVisibility
            Resource: !GetAtt WorkQueue.Arn

  LambdaQueueEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref FunctionName
      EventSourceArn: !GetAtt WorkQueue.Arn
      BatchSize: 1
      Enabled: true

  BookingAgentReportRule:
    Type: AWS::Events::Rule
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: booking-agent-report
      ScheduleExpression: cron(30 15 * * ? *)
      State: ENABLED
      Targets:
        - Id: lambda
          Arn: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${FunctionName}
          Input: '{"_booking_agent":true,"phase":"report"}'

  BookingAgentPrepRule:
    Type: AWS::Events::Rule
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # Named distinctly from the old (now-orphaned, disabled) "booking-agent-prep"
      # rule that predates this template — that rule is no longer used and should
      # be deleted manually to avoid a duplicate/conflicting schedule.
      Name: pickleball-booking-agent-prep
      # The +21/+22/+15 day offsets this phase checks only ever land on a
      # weekend when today is Fri/Sat/Sun (verified: today+21 shares today's
      # weekday, today+22 is tomorrow's, today+15 is also tomorrow's — none
      # of the three can be Sat/Sun on a Mon-Thu run). Mon-Thu runs are a
      # guaranteed no-op, so don't schedule them at all.
      ScheduleExpression: cron(30 14 ? * FRI,SAT,SUN *)
      State: ENABLED
      Tags:
        - Key: Project
          Value: pickleball-court-reservation
      Targets:
        - Id: lambda
          Arn: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${FunctionName}
          Input: '{"_booking_agent":true,"phase":"prep"}'

  ReleaseProbeQueueRule:
    Type: AWS::Events::Rule
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: pickleball-release-probe-queue
      ScheduleExpression: cron(45 14 ? * SAT,SUN *)
      State: ENABLED
      Targets:
        - Id: lambda
          Arn: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${FunctionName}

  BookingAgentReportInvokePermission:
    Type: AWS::Lambda::Permission
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref FunctionName
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt BookingAgentReportRule.Arn

  BookingAgentPrepInvokePermission:
    Type: AWS::Lambda::Permission
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref FunctionName
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt BookingAgentPrepRule.Arn

  ReleaseProbeQueueInvokePermission:
    Type: AWS::Lambda::Permission
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref FunctionName
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ReleaseProbeQueueRule.Arn

  FunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref FunctionName
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  UiBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref UiBucketName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${UiBucketName}/index.html
              - !Sub arn:${AWS::Partition}:s3:::${UiBucketName}/config.js
              - !Sub arn:${AWS::Partition}:s3:::${UiBucketName}/img/*

Outputs:
  WorkQueueUrl:
    Value: !Ref WorkQueue
  WorkQueueArn:
    Value: !GetAtt WorkQueue.Arn
  BookingAgentReportRuleArn:
    Value: !GetAtt BookingAgentReportRule.Arn
  BookingAgentPrepRuleArn:
    Value: !GetAtt BookingAgentPrepRule.Arn
  ReleaseProbeQueueRuleArn:
    Value: !GetAtt ReleaseProbeQueueRule.Arn
